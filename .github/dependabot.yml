# This disposable acceptance repository preserves production dependency checks
# but must not generate recurring version-update pull requests.
version: 2
updates:
  - package-ecosystem: "uv"
    directories:
      - "/"
      - "/scripts/process_issues_watcher"
      - "/src/auto_coder/mcp_servers/test_watcher"
      - "/utils/clone-issue"
      - "/utils/github-sub-issue"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      python-dependencies:
        applies-to: version-updates
        patterns: ["*"]
    ignore:
      # ghapi<2.0 calls fastcore.L.starmap(), which was removed in fastcore 2.0.
      # Keep receiving compatible fastcore 1.x updates until ghapi 2.x is adopted.
      - dependency-name: "fastcore"
        versions: [">=2.0.0"]
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      docker-dependencies:
        applies-to: version-updates
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      github-actions-dependencies:
        applies-to: version-updates
        patterns: ["*"]
